# goal: to run end to end devsecops CI pipeline

name: DevSecOps
permissions:
    contents: read
    packages: write

on:
    workflow_call:
    push:
        branches: [devsecops]

jobs:
    # --------CI------------
    #code stage
    code-quality:
        uses: ./.github/workflows/code-quality.yml

    # secret-scanning
    secret-scanning:
        uses: ./.github/workflows/secret-scanning.yml

    #dependency checks
    dependency-checks:
        uses: ./.github/workflows/dependency-scan.yml

    # docker checks
    docker-checks:
        uses: ./.github/workflows/docker-scans.yml
        secrets: inherit

    # SonarQube
    sonar-qube:
        uses: ./.github/workflows/sonar-scan.yml
        secrets: inherit

    # Code Tests
    code-tests:
        uses: ./.github/workflows/code-tests.yml

    # push-to-docker-hub
    docker-push:
        uses: ./.github/workflows/docker-push.yml
        needs:
            [
                code-quality,
                code-tests,
                sonar-qube,
                docker-checks,
                dependency-checks,
                secret-scanning,
            ]
        secrets: inherit

    # -------------CD----------------

    deploy:
        needs: [docker-push]
        uses: ./.github/workflows/deploy.yml
        secrets: inherit

    dast-scan:
        needs: [deploy]
        uses: ./.github/workflows/dast.yml
        secrets: inherit
